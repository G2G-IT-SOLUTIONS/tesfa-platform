services:
  # ----------------------------------------------------------
  # Application (PHP-FPM)
  # ----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: ${APP_ENV:-production}
    image: tesfa-app:${APP_ENV:-production}
    container_name: tesfa-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-tesfa_platform}
      - DB_USERNAME=${DB_USERNAME:-tesfa_user}
      - DB_PASSWORD=${DB_PASSWORD:-change_me}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    networks:
      - tesfa-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # ----------------------------------------------------------
  # Nginx (web server)
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: tesfa-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tesfa-network
    depends_on:
      - app

  # ----------------------------------------------------------
  # MySQL
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: tesfa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-tesfa_platform}
      MYSQL_USER: ${DB_USERNAME:-tesfa_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - tesfa-network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # Redis (cache + queue + session)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tesfa-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    networks:
      - tesfa-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ----------------------------------------------------------
  # Queue worker
  # ----------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: ${APP_ENV:-production}
    image: tesfa-app:${APP_ENV:-production}
    container_name: tesfa-worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_HOST=mysql
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    networks:
      - tesfa-network
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # ----------------------------------------------------------
  # Scheduler (cron)
  # ----------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: ${APP_ENV:-production}
    image: tesfa-app:${APP_ENV:-production}
    container_name: tesfa-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-tesfa.ini:ro 
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_HOST=mysql
      - REDIS_HOST=redis
    networks:
      - tesfa-network
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

networks:
  tesfa-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local